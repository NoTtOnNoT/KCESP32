<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geofencing Belt Pro - Real GPS Tracker</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- แผนที่แสดงผลเต็มจอ -->
    <div id="map"></div>

    <!-- แถบแจ้งเตือนสถานะลอยด้านบน -->
    <div class="floating-status-pill shadow" id="system-status-pill">
        <span class="status-dot bg-success" id="status-dot"></span>
        <span id="status-text">กำลังค้นหา GPS มือถือ...</span>
    </div>

    <!-- แบนเนอร์เตือนโหมดคลิกปักหมุดบ้าน -->
    <div class="picking-banner shadow" id="picking-banner" style="display: none;">
        <i class="fa-solid fa-crosshairs fa-spin me-2"></i> กรุณาคลิกบนแผนที่เพื่อเลือกตำแหน่งบ้านใหม่
        <button class="btn btn-sm btn-light ms-3 fw-bold text-danger" id="cancel-pick">ยกเลิก</button>
    </div>

    <!-- ปุ่มเมนูลอยขวาบน -->
    <div class="floating-fab-container">
        <button class="btn-fab shadow" id="toggle-settings" title="ตั้งค่าขอบเขตบ้าน">
            <i class="fa-solid fa-house-chimney-user"></i>
        </button>
        <button class="btn-fab shadow" id="toggle-info" title="สถานะผู้ป่วยเรียลไทม์">
            <i class="fa-solid fa-hospital-user"></i>
        </button>
    </div>

    <!-- แผงตั้งค่าขอบเขตบ้าน (Slide-up Panel) -->
    <div class="slide-panel shadow-lg" id="settings-panel">
        <div class="panel-header">
            <h5 class="mb-0"><i class="fa-solid fa-sliders me-2 text-primary"></i>ตั้งค่าจุดศูนย์กลางบ้าน</h5>
            <button class="btn-close-panel" id="close-settings"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="panel-body">
            <form id="geofence-form">
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">ละติจูดบ้าน (Lat):</label>
                    <input type="number" step="0.000001" id="home-lat" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">ลองจิจูดบ้าน (Lon):</label>
                    <input type="number" step="0.000001" id="home-lon" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">รัศมีปลอดภัยรอบบ้าน (เมตร):</label>
                    <input type="number" id="safe-radius" class="form-control" min="5" required>
                </div>

                <!-- ปุ่มฟังก์ชันดึงพิกัดบ้านด่วน -->
                <div class="d-grid gap-2 mb-3">
                    <button type="button" class="btn btn-outline-primary btn-sm" id="btn-get-location">
                        <i class="fa-solid fa-location-crosshairs me-1"></i> ใช้พิกัดปัจจุบันตั้งเป็นบ้าน
                    </button>
                    <button type="button" class="btn btn-outline-dark btn-sm" id="btn-pick-map">
                        <i class="fa-solid fa-hand-pointer me-1"></i> คลิกเลือกตำแหน่งบ้านจากแผนที่
                    </button>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">บันทึกการเปลี่ยนแปลง</button>
            </form>
        </div>
    </div>

    <!-- แผงแสดงข้อมูลผู้ป่วย (Slide-up Panel) -->
    <div class="slide-panel shadow-lg" id="info-panel">
        <div class="panel-header">
            <h5 class="mb-0"><i class="fa-solid fa-heart-pulse me-2 text-danger"></i>ข้อมูลพิกัดมือถือจริง</h5>
            <button class="btn-close-panel" id="close-info"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="panel-body">
            <ul class="list-group list-group-flush">
                <li class="list-group-item d-flex justify-content-between align-items-center px-0 py-3">
                    <span class="text-muted">พิกัดมือถือปัจจุบัน:</span>
                    <span id="patient-coords" class="fw-bold font-monospace">กำลังรอสัญญาณ GPS...</span>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center px-0 py-3">
                    <span class="text-muted">ระยะห่างจากบ้าน:</span>
                    <span id="distance-text" class="fw-bold text-primary fs-5">- เมตร</span>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center px-0 py-3">
                    <span class="text-muted">สถานะการติดตาม:</span>
                    <span class="badge bg-success px-3 py-2 rounded-pill" id="gps-status-badge">กำลังเชื่อมต่อ GPS</span>
                </li>
            </ul>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
