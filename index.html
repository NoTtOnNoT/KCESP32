<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AltGuard - Alzheimer Real-time Tracking System</title>
  
  <!-- Leaflet CSS (แผนที่) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- FontAwesome (ไอคอน) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif, system-ui; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
    
    /* Navigation Bar */
    header {
      background: #1e293b;
      padding: 15px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      z-index: 1000;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand i { font-size: 1.8rem; color: #38bdf8; }
    .brand h1 { font-size: 1.4rem; font-weight: 600; }

    .status-badge {
      padding: 8px 16px;
      border-radius: 9999px;
      font-weight: bold;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-safe { background-color: #059669; color: #ecfdf5; }
    .status-emergency { 
      background-color: #dc2626; 
      color: #fef2f2; 
      animation: pulse 1.2s infinite; 
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    /* Main Container Layout */
    .main-container { display: flex; flex: 1; flex-direction: column; overflow: hidden; }
    @media (min-width: 768px) { .main-container { flex-direction: row; } }

    /* Control Sidebar */
    .sidebar {
      width: 100%;
      max-width: 340px;
      background-color: #1e293b;
      padding: 20px;
      border-right: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    .card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
    }
    .card-title { font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; }
    .card-value { font-size: 1.25rem; font-weight: bold; color: #38bdf8; }

    .btn-action {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .btn-action:hover { background-color: #1d4ed8; }

    /* Map Area */
    #map { flex: 1; width: 100%; height: 100%; min-height: 400px; }
  </style>
</head>
<body>

  <!-- Header Section -->
  <header>
    <div class="brand">
      <i class="fa-solid fa-shield-heart"></i>
      <h1>AltGuard Caregiver</h1>
    </div>
    <div id="statusBadge" class="status-badge status-safe">
      <i class="fa-solid fa-circle-check"></i>
      <span id="statusText">อยู่ในเขตปลอดภัย</span>
    </div>
  </header>

  <!-- Main Application Body -->
  <div class="main-container">
    
    <!-- Left Sidebar Details -->
    <div class="sidebar">
      <div class="card">
        <div class="card-title"><i class="fa-solid fa-wifi"></i> ช่องทางส่งข้อมูล</div>
        <div id="netType" class="card-value">4G Cellular / Wi-Fi</div>
      </div>

      <div class="card">
        <div class="card-title"><i class="fa-solid fa-ruler"></i> ระยะห่างจากพิกัดบ้าน</div>
        <div id="distanceVal" class="card-value">0.0 เมตร</div>
      </div>

      <div class="card">
        <div class="card-title"><i class="fa-solid fa-location-crosshairs"></i> พิกัด GPS ผู้ป่วย</div>
        <div style="font-size: 0.95rem; color: #e2e8f0; margin-top: 4px;">
          Lat: <span id="latVal" style="color: #38bdf8;">0.000000</span><br>
          Lng: <span id="lngVal" style="color: #38bdf8;">0.000000</span>
        </div>
      </div>

      <div class="card">
        <div class="card-title"><i class="fa-regular fa-clock"></i> อัปเดตล่าสุดเมื่อ</div>
        <div id="lastUpdate" style="font-size: 0.95rem; color: #cbd5e1;">-</div>
      </div>

      <button class="btn-action" onclick="centerMapToPatient()">
        <i class="fa-solid fa-crosshairs"></i> เลื่อนแผนที่ไปหาผู้ป่วย
      </button>
    </div>

    <!-- Right Interactive Map -->
    <div id="map"></div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // --- ตั้งค่าพิกัดบ้าน (SAFE ZONE) ---
    const HOME_LAT = 6.629356;
    const HOME_LNG = 100.422675;
    const SAFE_RADIUS = 50; // รัศมีวงกลมปลอดภัย (เมตร)

    // ตัวแปรแผนที่ Leaflet
    let map = L.map('map').setView([HOME_LAT, HOME_LNG], 17);
    let patientMarker = null;

    // โหลด OpenStreetMap Tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // ปักหมุดพิกัดบ้าน + วาดวงกลม Geofence
    L.marker([HOME_LAT, HOME_LNG]).addTo(map).bindPopup('<b>🏠 พิกัดบ้าน (Safe Zone)</b>');
    L.circle([HOME_LAT, HOME_LNG], {
      color: '#10b981',
      fillColor: '#10b981',
      fillOpacity: 0.15,
      radius: SAFE_RADIUS
    }).addTo(map);

    // ไอคอนหมุดผู้ป่วย
    const patientIcon = L.icon({
      iconUrl: 'https://cdn-icons-png.flaticon.com/512/484/484167.png', // หมุดสีแดงฉุกเฉิน
      iconSize: [38, 38],
      iconAnchor: [19, 38],
      popupAnchor: [0, -38]
    });

    let currentPatientPos = [HOME_LAT, HOME_LNG];

    // --- ฟังก์ชันดึงข้อมูลจาก Cloud API ---
    async function fetchPatientData() {
      try {
        // เปลี่ยน URL ตรงนี้เป็น Cloud API ของคุณ (เช่น Firebase / Vercel / PHP Web Server)
        // เปลี่ยนจากของเดิม ให้เป็น Firebase URL ของคุณ
        const response = await fetch('https://kcesp32-default-rtdb.asia-southeast1.firebasedatabase.app/location.json');
        const data = await response.json();

        const lat = data.lat;
        const lng = data.lng;
        const distance = data.distance;
        const status = data.status; // 'SAFE_ZONE' หรือ 'EMERGENCY'
        const netType = data.net_type; // 'Wi-Fi' หรือ '4G SIM'

        currentPatientPos = [lat, lng];

        // อัปเดตข้อมูลบน UI
        document.getElementById('latVal').innerText = lat.toFixed(6);
        document.getElementById('lngVal').innerText = lng.toFixed(6);
        document.getElementById('distanceVal').innerText = distance.toFixed(1) + ' เมตร';
        document.getElementById('netType').innerText = netType;
        document.getElementById('lastUpdate').innerText = new Date().toLocaleTimeString('th-TH');

        // อัปเดตสถานะการแจ้งเตือน
        const badge = document.getElementById('statusBadge');
        const statusText = document.getElementById('statusText');

        if (status === 'SAFE_ZONE') {
          badge.className = 'status-badge status-safe';
          statusText.innerText = 'อยู่ในเขตปลอดภัย';
        } else {
          badge.className = 'status-badge status-emergency';
          statusText.innerText = '🚨 เตือนภัย! ออกนอกเขตปลอดภัย';
        }

        // ปักหมุดผู้ป่วยบนแผนที่
        if (!patientMarker) {
          patientMarker = L.marker(currentPatientPos, { icon: patientIcon }).addTo(map)
            .bindPopup('<b>🧍 พิกัดปัจจุบันของผู้ป่วย</b>').openPopup();
        } else {
          patientMarker.setLatLng(currentPatientPos);
        }

      } catch (error) {
        console.error('ไม่สามารถดึงข้อมูลพิกัดได้:', error);
      }
    }

    function centerMapToPatient() {
      map.flyTo(currentPatientPos, 18);
    }

    // ดึงข้อมูลพิกัดใหม่ทุกๆ 3 วินาที
    setInterval(fetchPatientData, 3000);
    fetchPatientData();
  </script>
</body>
</html>
